<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checklists</title>
    <style>
        body {
            margin: 40px;
            font-family: Ubuntu, Optima, Segoe, Segoe UI, Candara, Calibri, Arial, sans-serif;
            color: #202124;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 34px;
            font-weight: 600;
        }

        .meta {
            margin-bottom: 24px;
            color: #777;
            font-size: 13px;
        }

        .search {
            margin-bottom: 18px;
        }

        .search input {
            width: min(420px, 100%);
            height: 34px;
            padding: 4px 10px;
            font-size: 15px;
        }

        .tab {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px;
            border-bottom: 1px solid #d0d0d0;
        }

        .tab button {
            border: 1px solid #d0d0d0;
            border-bottom: none;
            background: #f5f5f5;
            cursor: pointer;
            padding: 10px 14px;
            font-size: 14px;
        }

        .tab button.active {
            background: #fff;
            font-weight: 600;
        }

        .section {
            margin: 0 0 22px;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
        }

        .section-title {
            margin: 0 0 12px;
            color: #555;
            font-size: 15px;
            font-weight: 600;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .doc {
            display: block;
            min-height: 260px;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            color: inherit;
            text-decoration: none;
        }

        .icon {
            display: block;
            width: 96px;
            height: 96px;
            margin: 8px auto 14px;
            object-fit: contain;
            filter: grayscale(100%);
        }

        .type {
            color: #777;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .title {
            margin: 6px 0 8px;
            color: #3b2e83;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.25;
        }

        .summary {
            color: #555;
            font-size: 13px;
            line-height: 1.45;
        }

        .empty {
            padding: 24px;
            color: #777;
            border: 1px dashed #ccc;
            border-radius: 6px;
        }
    </style>
    <link rel="stylesheet" target="_blank" href="https://fonts.googleapis.com/css?family=Ubuntu">
</head>
<body>
<h1>Checklists</h1>
<div class="meta">Generated ${date}</div>
<div class="search">
    <input id="filter" type="text" placeholder="search..." onkeyup="render()">
    <span id="summary"></span>
</div>
<div class="tab" id="tabs"></div>
<div id="content"></div>

<script>
    const data = ${data};
    let activeTab = data.length ? data[0].tab : '';

    function escapeHtml(value) {
        return String(value || '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function setTab(tab) {
        activeTab = tab;
        render();
    }

    function renderTabs() {
        let html = '';
        data.forEach(group => {
            const active = group.tab === activeTab ? ' active' : '';
            html += '<button class="tablink' + active + '" onclick="setTab(\'' + escapeHtml(group.tab) + '\')">' + escapeHtml(group.tab) + '</button>';
        });
        document.getElementById('tabs').innerHTML = html;
    }

    function itemMatches(item, filterText) {
        const haystack = [
            item.type,
            item.title,
            item.summary
        ].join(' ').toLowerCase();
        return haystack.includes(filterText);
    }

    function renderCard(item) {
        let html = '<a class="doc" href="' + escapeHtml(item.link) + '" target="_blank">';
        html += '<img class="icon" src="icons/' + escapeHtml(item.icon || 'logo.png') + '" alt="">';
        html += '<div class="type">' + escapeHtml(item.type || '') + '</div>';
        html += '<div class="title">' + escapeHtml(item.title || '') + '</div>';
        html += '<div class="summary">' + escapeHtml(item.summary || '') + '</div>';
        html += '</a>';
        return html;
    }

    function render() {
        const filterText = document.getElementById('filter').value.trim().toLowerCase();
        renderTabs();

        let total = 0;
        let html = '';
        const tabs = filterText ? data : data.filter(group => group.tab === activeTab);

        tabs.forEach(tab => {
            tab.resources.forEach(section => {
                const items = section.items.filter(item => !filterText || itemMatches(item, filterText));
                if (!items.length) return;

                total += items.length;
                html += '<div class="section">';
                html += '<div class="section-title">' + escapeHtml(tab.tab) + ' / ' + escapeHtml(section.title) + '</div>';
                html += '<div class="cards">';
                items.forEach(item => {
                    html += renderCard(item);
                });
                html += '</div></div>';
            });
        });

        document.getElementById('summary').innerHTML = filterText ? ' = ' + total + ' item' + (total === 1 ? '' : 's') : '';
        document.getElementById('content').innerHTML = html || '<div class="empty">No checklists found.</div>';
    }

    render();
</script>
</body>
</html>
