<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Compliance Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
    <style>
        :root {
            --ink: #101828;
            --muted: #667085;
            --faint: #98a2b3;
            --bg: #fafbfc;
            --surface: #ffffff;
            --border: #e4e7ec;
            --accent: #4f46e5;
            --accent-soft: #eef2ff;
            --red: #dc2626;
            --red-soft: #fef2f2;
            --yellow: #d97706;
            --yellow-soft: #fffbeb;
            --green: #16a34a;
            --green-soft: #f0fdf4;
            --focus-flag: #7c3aed;
            --focus-flag-soft: #f5f3ff;
            --radius: 12px;
            --shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            max-width: 1240px;
            margin: 0 auto;
            padding: 32px 24px 64px;
        }

        h1, h2, h3, .score-value {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
        }

        .muted { color: var(--muted); }

        /* ---------- Hero ---------- */
        .hero {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .hero-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            border-radius: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px;
            flex-shrink: 0;
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 2px;
        }

        .hero-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0 0 8px;
            line-height: 1.2;
        }

        .meta-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .meta-chip {
            font-size: 12px;
            color: var(--muted);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 3px 10px;
            white-space: nowrap;
            max-width: 420px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---------- Scoreboard ---------- */
        .scoreboard {
            display: flex;
            align-items: stretch;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .maturity-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 22px;
            min-width: 280px;
            flex: 1 1 300px;
        }

        .score-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .score-value {
            font-size: 34px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .score-denom {
            font-size: 15px;
            color: var(--faint);
            font-variant-numeric: tabular-nums;
        }

        .band-label {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .dist-bar {
            display: flex;
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
            background: var(--border);
        }

        .dist-bar .seg-red { background: var(--red); }
        .dist-bar .seg-yellow { background: #f59e0b; }
        .dist-bar .seg-green { background: var(--green); }

        /* ---------- Filter chips ---------- */
        .filters {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            align-content: center;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 8px 14px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
        }

        .chip:hover { border-color: var(--faint); }

        .chip:focus-visible,
        .search-input:focus-visible,
        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .chip .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .chip .count {
            font-variant-numeric: tabular-nums;
            color: var(--muted);
        }

        .chip.red .dot { background: var(--red); }
        .chip.yellow .dot { background: #f59e0b; }
        .chip.green .dot { background: var(--green); }
        .chip.focus .dot { background: var(--focus-flag); }

        .chip.active { border-color: currentColor; }
        .chip.red.active { background: var(--red-soft); color: var(--red); }
        .chip.yellow.active { background: var(--yellow-soft); color: var(--yellow); }
        .chip.green.active { background: var(--green-soft); color: var(--green); }
        .chip.focus.active { background: var(--focus-flag-soft); color: var(--focus-flag); }
        .chip.active .count { color: inherit; }

        /* ---------- Toolbar ---------- */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 0;
            margin-bottom: 20px;
            background: linear-gradient(var(--bg) 85%, rgba(250, 251, 252, 0));
        }

        .search-wrap {
            position: relative;
            flex: 1 1 260px;
            max-width: 440px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--faint);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            font: inherit;
            font-size: 14px;
            padding: 9px 36px 9px 36px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--ink);
            box-shadow: var(--shadow);
        }

        .search-input::placeholder { color: var(--faint); }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .search-hint {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 11px;
            color: var(--faint);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 1px 6px;
            background: var(--bg);
            pointer-events: none;
        }

        .filter-count {
            color: var(--muted);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .btn {
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
        }

        .btn:hover { background: var(--accent-soft); }
        .btn[hidden] { display: none; }

        /* ---------- Domain cards ---------- */
        .domains {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
            align-items: start;
        }

        .domain-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 20px 10px;
        }

        .domain-card summary {
            cursor: pointer;
            list-style: none;
        }

        .domain-card summary::-webkit-details-marker { display: none; }

        .domain-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .domain-name {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
        }

        .domain-name .caret {
            display: inline-block;
            color: var(--faint);
            font-size: 11px;
            margin-right: 6px;
            transition: transform 0.15s;
        }

        details[open] .domain-name .caret { transform: rotate(90deg); }

        .domain-score {
            font-size: 12px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            padding: 3px 9px;
            border-radius: 999px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .domain-score.red { background: var(--red-soft); color: var(--red); }
        .domain-score.yellow { background: var(--yellow-soft); color: var(--yellow); }
        .domain-score.green { background: var(--green-soft); color: var(--green); }

        .domain-desc {
            color: var(--muted);
            font-size: 13px;
            margin: 6px 0 10px;
        }

        .domain-card .dist-bar { height: 5px; margin-bottom: 4px; }

        /* ---------- Control rows ---------- */
        .control-list {
            margin: 6px 0 8px;
            padding: 0;
            list-style: none;
        }

        .control-row {
            display: flex;
            gap: 10px;
            padding: 10px 8px;
            border-radius: 8px;
            border-top: 1px solid var(--border);
        }

        .control-row:hover { background: var(--bg); }

        .control-row .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 6px;
            flex-shrink: 0;
        }

        .dot.red { background: var(--red); }
        .dot.yellow { background: #f59e0b; }
        .dot.green { background: var(--green); }

        .control-link {
            color: var(--ink);
            font-weight: 500;
            text-decoration: none;
        }

        .control-link:hover { color: var(--accent); text-decoration: underline; }

        .control-desc {
            color: var(--muted);
            font-size: 13px;
            margin-top: 1px;
        }

        .control-meta {
            color: var(--faint);
            font-size: 12px;
            margin-top: 3px;
        }

        .focus-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: var(--focus-flag-soft);
            color: var(--focus-flag);
            padding: 2px 7px;
            border-radius: 999px;
            margin-left: 8px;
            vertical-align: 1px;
        }

        /* ---------- Empty state / footer ---------- */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 56px 20px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
        }

        .empty-state .btn { margin-top: 8px; }

        .page-footer {
            margin-top: 40px;
            color: var(--faint);
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 640px) {
            .page { padding: 20px 14px 48px; }
            .hero { gap: 14px; }
            .hero-logo { width: 56px; height: 56px; }
            .hero-title { font-size: 22px; }
            .domains { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
<div class="page">
    <header class="hero">
        <img class="hero-logo" id="heroLogo" src="icons/logo.png" alt="">
        <div>
            <div class="eyebrow">Controls Dashboard</div>
            <h1 id="heroTitle" class="hero-title">Compliance Dashboard</h1>
            <div id="heroMeta" class="meta-chips"></div>
        </div>
    </header>

    <section class="scoreboard" aria-label="Overall maturity and filters">
        <div class="maturity-card">
            <div class="score-row">
                <span class="score-value" id="scoreValue">–</span>
                <span class="score-denom">/ 3.00 weighted maturity</span>
            </div>
            <div class="band-label" id="bandLabel"></div>
            <div class="dist-bar" id="overallBar" title="Distribution of control statuses"></div>
        </div>
        <div class="filters" id="filters" role="group" aria-label="Filter controls by status"></div>
    </section>

    <div class="toolbar">
        <div class="search-wrap">
            <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
            <input type="search" class="search-input" id="searchBox" placeholder="Search controls, domains, owners…" aria-label="Search controls"/>
            <span class="search-hint" id="searchHint">/</span>
        </div>
        <span id="filterCount" class="filter-count" aria-live="polite"></span>
        <button class="btn" id="clearBtn" hidden onclick="clearFilters()">Clear filters</button>
    </div>

    <main id="domains" class="domains"></main>

    <footer class="page-footer">Generated on 2026-08-23</footer>
</div>

    const currentData = {"metadata": {"title": "Software Managers' Modern Software Development Excellence Checklist", "version": "1.0", "created_at": "2026-03-22T00:00:00+00:00", "icon": "engineering.png", "intended_use": ["Track software development excellence control status", "Store evidence links", "Assign owners", "Support simple dashboarding and scoring"], "regions": ["Global"], "primary_regulatory_focus": ["Software development excellence", "AI-augmented engineering", "Security", "Delivery quality"], "status_values": ["red", "yellow", "green"], "default_status": "red"}, "scoring_model": {"status_to_score": {"red": 1, "yellow": 2, "green": 3}, "score_to_status": {"1": "red", "2": "yellow", "3": "green"}, "definitions": {"red": {"score": 1, "label": "Missing or weak", "criteria": ["Control is absent or ineffective", "Evidence is missing or outdated", "The team is exposed to avoidable delivery or operational risk"]}, "yellow": {"score": 2, "label": "Partial or inconsistent", "criteria": ["Control exists but is unevenly applied", "Evidence is partial or manually maintained", "The practice depends too much on individuals"]}, "green": {"score": 3, "label": "Effective and repeatable", "criteria": ["Control is documented and embedded in team workflows", "Evidence is current and easy to inspect", "The practice supports predictable and safe delivery"]}}, "overall_maturity_bands": [{"min": 1.0, "max": 1.5, "status": "red", "label": "Fragile / reactive"}, {"min": 1.6, "max": 2.2, "status": "yellow", "label": "Developing / uneven"}, {"min": 2.3, "max": 3.0, "status": "green", "label": "Strong / modern and repeatable"}]}, "dashboard_fields": {"control_level": ["id", "name", "description", "priority", "weight", "status", "score", "owner", "last_reviewed", "target_date", "notes", "evidence_links", "evidence_examples", "scoring_criteria"], "domain_level": ["id", "name", "description", "weight", "controls"]}, "domains": [{"id": "found", "name": "Modern Development Foundations", servability are considered, but not consistently built in.", "green": "Teams design with strong default expectations for security, scalability, and observability."}}, {"id": "found-04", "name": "Automation First", "description": "Automate everything that does not require human judgment.", "priority": "high", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Automation roadmap", "Workflow automation scripts", "Manual toil reduction metrics"], "scoring_criteria": {"red": "Teams still rely heavily on manual repetitive work.", "yellow": "Some repetitive work is automated, but major gaps remain.", "green": "Repetitive engineering work is systematically automated to reduce toil and error."}}, {"id": "found-05", "name": "Outcome Measurement", "description": "Measure outcomes, not just output.", "priority": "high", "weight": 1.0, "status": "green", "score": 3, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Outcome metrics dashboard", "Engineering KPI review", "Customer-impact scorecards"], "scoring_criteria": {"red": "Success is mostly measured through activity or output counts.", "yellow": "Some outcome measures exist, but they do not consistently guide decisions.", "green": "Teams measure outcomes that connect engineering work to customer and business value."}}, {"id": "found-06", "name": "Learning and Accountability Culture", "description": "Foster a culture of learning, experimentation, and accountability.", "priority": "high", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Retrospective actions", "Experiment review notes", "Manager expectations for accountability"], "scoring_criteria": {"red": "Teams lack structured learning and accountability for outcomes.", "yellow": "Learning happens, but not consistently or with clear follow-through.", "green": "Teams learn quickly, experiment responsibly, and hold themselves accountable for results."}}]}, {"id": "aidev", "name": "AI-Augmented Development", "description": "Responsible use of AI tools across the software development lifecycle.", "weight": 1.3, "controls": [{"id": "aidev-01", "name": "AI Tool Governance", "description": "Approved AI tools are defined and governed.", "priority": "high", "weight": 1.0, "status": "yellow", "score": 2, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Approved AI tools list", "AI governance policy", "Vendor review records"], "scoring_criteria": {"red": "Teams use AI tools without a clear approved set or governance model.", "yellow": "Approved tools exist, but governance is incomplete or weakly enforced.", "green": "AI tools are approved, governed, and reviewed through a clear ownership model."}}, {"id": "aidev-02", "name": "AI Code Usage Guidelines", "description": "Clear guidelines exist for AI-generated code usage and review.", "priority": "high", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["AI coding policy", "Review checklist", "Engineering handbook entry"], "scoring_criteria": {"red": "No clear expectations exist for how AI-generated code should be used or reviewed.", "yellow": "Guidelines exist but are incomplete or unevenly applied.", "green": "Clear and practical guidelines define acceptable AI-generated code usage and review."}}, {"id": "aidev-03", "name": "Sensitive Data Protection", "description": "Sensitive data is not exposed to external AI systems.", "priority": "high", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Data handling policy", "Prompt redaction guidance", "DLP controls"], "scor "}}]}, {"id": "team", "name": "Team Health and Culture", "description": "Healthy team dynamics that support strong systems and sustainable delivery.", "weight": 1.2, "controls": [{"id": "team-01", "name": "Psychological Safety", "description": "Psychological safety enables open discussion.", "priority": "high", "weight": 1.0, "status": "green", "score": 3, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Team health survey", "Retrospective notes", "Manager follow-up actions"], "scoring_criteria": {"red": "People avoid speaking openly about risks, mistakes, or concerns.", "yellow": "Some openness exists, but it is uneven across teams or topics.", "green": "Teams feel safe to raise concerns, discuss failure, and challenge decisions."}}, {"id": "team-02", "name": "Business Context Understanding", "description": "Engineers understand business context.", "priority": "medium", "weight": 1.0, "status": "green", "score": 3, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Product context sessions", "Business metric reviews", "Planning notes"], "scoring_criteria": {"red": "Engineers work with little understanding of business context or customer value.", "yellow": "Some business context is shared, but not deeply enough.", "green": "Engineers understand the business context behind their work."}}, {"id": "team-03", "name": "Effective Feedback Loops", "description": "Feedback loops such as retrospectives and 1:1s are effective.", "priority": "medium", "weight": 1.0, "status": "green", "score": 3, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Retro actions", "1:1 themes", "Improvement follow-up records"], "scoring_criteria": {"red": "Feedback loops exist in form only and do not improve outcomes.", "yellow": "Feedback loops produce some improvement, but consistency is weak.", "green": "Retrospectives and 1:1s create clear feedback and action."}}, {"id": "team-04", "name": "Clear Ownership", "description": "Ownership is clear at all levels.", "priority": "high", "weight": 1.0, "status": "yellow", "score": 2, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Ownership map", "Service owner registry", "Decision accountability model"], "scoring_criteria": {"red": "Ownership is ambiguous and issues fall between teams or people.", "yellow": "Most ownership is clear, but gaps still create friction.", "green": "Ownership is explicit and understood across systems and decisions."}}, {"id": "team-05", "name": "Knowledge Sharing", "description": "Knowledge sharing is encouraged.", "priority": "medium", "weight": 1.0, "status": "green", "score": 3, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Internal demos", "Guild sessions", "Knowledge base contributions"], "scoring_criteria": {"red": "Knowledge is siloed and hard to access.", "yellow": "Sharing happens, but not with enough consistency or reach.", "green": "Knowledge sharing is part of how teams operate."}}, {"id": "team-06", "name": "Burnout Risk Management", "description": "Burnout risk is monitored and addressed.", "priority": "high", "weight": 1.0, "status": "green", "score": 3, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Capacity review", "On-call burden metrics", "Manager action plans"], "scoring_criteria": {"red": "Burnout risks are not monitored or addressed proactively.", "yellow": "Burnout concerns are recognized, but responses are reactive.", "green": "Burnout risk is monitored and addressed before it becomes systemic."}}, {"id": "team-07", "name": "AI as Augmentation", "description": "AI is positioned as an augmentation tool.", "priority": "medium", "weight": 1.0, "status": "yellow", "score": 2, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Leadership messaging", "AI enablement guidance", "Capability development notes"], "scoring_criteria": {"red": "AI is framed in ways that undermine ownership, learning, or trust.", "yellow": "The intended augmentation mindset exists, but is not fully internalized.", "green": "AI is clearly positioned as a tool that augments human capability and responsibility."}}]}, {"id": "docs", "name": "Documentation and Knowledge Management", "description": "Accessible, current knowledge that supports scale and resilience.", "weight": 1.1, "controls": [{"id": "docs-01", "name": "Documentation as Product", "description": "Documentation is treated as part of the product.", "priority": "medium", "weight": 1.0, "status": "green", "score": 3, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Documentation standards", "Doc ownership model", "Release checklist"], "scoring_criteria": {"red": "Documentation is treated as optional or secondary work.", "yellow": "Documentation matters, but maintenance discipline is uneven.", "green": "Documentation is treated as a first-class engineering deliverable."}}, {"id": "docs-02", "name": "Architecture API and Workflow Documentation", "description": "Architecture, APIs, and workflows are documented.", "priority": "high", "weight": 1.0, "status": "yellow", "score": 2, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Architecture diagrams", "API docs", "Workflow guides"], "scoring_criteria": {"red": "Core architecture and workflows are poorly documented.", "yellow": "Some core artifacts are documented, but important gaps remain.", "green": "Architecture, APIs, and workflows are documented and maintained."}}, {"id": "docs-03", "name": "Runbooks and Onboarding Guides", "description": "Runbooks and onboarding guides are up to date.", "priority": "high", "weight": 1.0, "status": "yellow", "score": 2, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Runbook library", "Onboarding guide", "Recent review history"], "scoring_criteria": {"red": "Operational and onboarding documentation is outdated or missing.", "yellow": "Guides exist, but accuracy and freshness are inconsistent.", "green": "Runbooks and onboarding guides are current and trusted."}}, {"id": "docs-04", "name": "AI-Assisted Documentation", "description": "AI assists in generating and maintaining documentation.", "priority": "medium", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Doc generation workflows", "AI documentation prompts", "Documentation refresh experiments"], "scoring_criteria": {"red": "AI is not used meaningfully to reduce documentation maintenance burden.", "yellow": "AI supports documentation in some cases, but not as a repeatable practice.", "green": "AI is used responsibly to accelerate documentation creation and maintenance."}}, {"id": "docs-05", "name": "Tribal Knowledge Reduction", "description": "Tribal knowledge is minimized.", "priority": "high", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Single-point-of-failure analysis", "Knowledge transfer sessions", "Documentation coverage report"], "scoring_criteria": {"red": "Critical knowledge lives mostly in people's heads.", "yellow": "Some tribal knowledge has been reduced, but key dependencies remain.", "green": "Teams actively reduce tribal knowledge through documentation and sharing."}}]}, {"id": "improve", "name": "Continuous Improvement and Innovation", "description": "Deliberate evolution of technology, practices, and customer impact.", "weight": 1.2, "controls": [{"id": "improve-01", "name": "Actionable Retrospectives", "description": "Retrospectives produce actionable improvements.", "priority": "medium", "weight": 1.0, "status": "green", "score": 3, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Retro action tracker", "Sprint retrospective notes", "Follow-up review"], "scoring_criteria": {"red": "Retrospectives rarely produce meaningful change.", "yellow": "Retrospectives generate actions, but follow-through is inconsistent.", "green": "Retrospectives reliably produce and close actionable improvements."}}, {"id": "improve-02", "name": "Technical Debt Management", "description": "Technical debt is tracked and prioritized.", "priority": "high", "weight": 1.0, "status": "yellow", "score": 2, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Tech debt backlog", "Prioritization framework", "Debt review meeting notes"], "scoring_criteria": {"red": "Technical debt is mostly invisible or ignored.", "yellow": "Debt is tracked, but prioritization is inconsistent.", "green": "Technical debt is visible, prioritized, and addressed intentionally."}}, {"id": "improve-03", "name": "Experimentation with Success Criteria", "description": "Experimentation is encouraged with clear success criteria.", "priority": "medium", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Experiment template", "Hypothesis logs", "Outcome reviews"], "scoring_criteria": {"red": "Experimentation happens rarely or without clear learning goals.", "yellow": "Experiments occur, but success criteria or follow-through are weak.", "green": "Experimentation is encouraged and tied to explicit success criteria."}}, {"id": "improve-04", "name": "Pragmatic Emerging Technology Evaluation", "description": "Emerging technologies including AI are evaluated pragmatically.", "priority": "medium", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Technology radar", "Evaluation notes", "Adoption decision records"], "scoring_criteria": {"red": "Technology choices follow hype or inertia rather than pragmatic assessment.", "yellow": "Some technology evaluation happens, but rigor is inconsistent.", "green": "Emerging technologies are evaluated pragmatically against real needs and trade-offs."}}, {"id": "improve-05", "name": "Practice Refinement", "description": "Practices are regularly refined.", "priority": "medium", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Practice review cadence", "Process improvement notes", "Updated team standards"], "scoring_criteria": {"red": "Practices become stale and are rarely revisited.", "yellow": "Practices evolve, but refinement is sporadic.", "green": "Practices are reviewed and refined on a deliberate cadence."}}, {"id": "improve-06", "name": "Customer Impact Focus", "description": "Success is measured by customer impact.", "priority": "high", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Customer outcome metrics", "Impact review notes", "Engineering-business KPI link"], "scoring_criteria": {"red": "Improvement work is disconnected from customer outcomes.", "yellow": "Customer impact is considered, but not consistently measured.", "green": "Teams judge success through measurable customer impact."}}]}]};
    let activeStatus = '';
    let filterFocus = false;

    function esc(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function metadataChips(metadata) {
        if (!metadata) return [];
        const chips = [];
        if (metadata.version) chips.push('v' + metadata.version);
        if (metadata.regions && metadata.regions.length) chips.push(metadata.regions.join(', '));
        (metadata.primary_regulatory_focus || []).forEach(f => chips.push(f));
        if (metadata.source && metadata.source.title) {
            chips.push(metadata.source.author
                ? metadata.source.title + ' — ' + metadata.source.author
                : metadata.source.title);
        }
        return chips;
    }

    function safeScore(control) {
        if (typeof control.score === "number") return control.score;
        return {red: 1, yellow: 2, green: 3}[control.status] || 1;
    }

    function weightedAverage(controls, domainWeight) {
        let weighted = 0, weights = 0;
        controls.forEach(c => {
            const w = (domainWeight || 1) * (c.weight || 1);
            weighted += safeScore(c) * w;
            weights += w;
        });
        return weights ? (weighted / weights) : 0;
    }

    function overallMaturity() {
        let weighted = 0, weights = 0;
        currentData.domains.forEach(d => {
            d.controls.forEach(c => {
                const w = (d.weight || 1) * (c.weight || 1);
                weighted += safeScore(c) * w;
                weights += w;
            });
        });
        return weights ? (weighted / weights) : 0;
    }

    function maturityBand(score) {
        const bands = (currentData.scoring_model && currentData.scoring_model.overall_maturity_bands) || [];
        for (const b of bands) {
            if (score >= b.min && score <= b.max) return b;
        }
        return null;
    }

    function scoreClass(score) {
        const band = maturityBand(score);
        if (band && band.status) return band.status;
        return score < 1.6 ? 'red' : score < 2.3 ? 'yellow' : 'green';
    }

    function countStatuses(controls) {
        const counts = {red: 0, yellow: 0, green: 0, focus: 0, total: 0};
        controls.forEach(c => {
            counts[c.status] = (counts[c.status] || 0) + 1;
            if (c.inFocus) counts.focus++;
            counts.total++;
        });
        return counts;
    }

    function allControls() {
        return currentData.domains.flatMap(d => d.controls);
    }

    function distBarHtml(counts) {
        if (!counts.total) return '';
        return ['red', 'yellow', 'green']
            .filter(s => counts[s] > 0)
            .map(s => '<div class="seg-' + s + '" style="flex:' + counts[s] + '" title="' + counts[s] + ' ' + s + '"></div>')
            .join('');
    }

    function toggleStatus(status) {
        filterFocus = false;
        activeStatus = activeStatus === status ? '' : status;
        render();
    }

    function toggleFocus() {
        filterFocus = !filterFocus;
        activeStatus = '';
        render();
    }

    function clearFilters() {
        activeStatus = '';
        filterFocus = false;
        document.getElementById('searchBox').value = '';
        render();
    }

    function renderScoreboard() {
        const score = overallMaturity();
        const band = maturityBand(score);
        const counts = countStatuses(allControls());

        document.getElementById('scoreValue').textContent = score.toFixed(2);
        document.getElementById('bandLabel').textContent = band ? band.label : '';
        document.getElementById('overallBar').innerHTML = distBarHtml(counts);

        const chip = (cls, label, count, active, onclick) =>
            '<button class="chip ' + cls + (active ? ' active' : '') + '" aria-pressed="' + active + '" onclick="' + onclick + '">' +
            '<span class="dot"></span>' + label + '<span class="count">' + count + '</span></button>';

        document.getElementById('filters').innerHTML =
            chip('red', 'Red', counts.red, activeStatus === 'red', "toggleStatus('red')") +
            chip('yellow', 'Yellow', counts.yellow, activeStatus === 'yellow', "toggleStatus('yellow')") +
            chip('green', 'Green', counts.green, activeStatus === 'green', "toggleStatus('green')") +
            (counts.focus ? chip('focus', 'In Focus', counts.focus, filterFocus, 'toggleFocus()') : '');
    }

    function controlMeta(c) {
        const parts = [];
        if (c.owner) parts.push(c.owner);
        if (c.priority) parts.push(c.priority + ' priority');
        if (c.target_date) parts.push('Target ' + c.target_date);
        return parts.join(' · ');
    }

    function renderDomains() {
        const q = document.getElementById('searchBox').value.trim().toLowerCase();
        let totalVisible = 0;

        const html = currentData.domains.map(dom => {
            const visible = dom.controls.filter(c => {
                if (filterFocus && !c.inFocus) return false;
                if (activeStatus && c.status !== activeStatus) return false;
                if (q) {
                    const blob = [dom.name, c.id, c.name, c.description, c.owner, c.priority, c.notes].join(' ').toLowerCase();
                    if (!blob.includes(q)) return false;
                }
                return true;
            });

            if (!visible.length) return '';
            totalVisible += visible.length;

            const avg = weightedAverage(dom.controls);
            const counts = countStatuses(dom.controls);
            const filtered = visible.length < dom.controls.length;

            return `
          <details open class="domain-card">
            <summary>
              <div class="domain-head">
                <div class="domain-name"><span class="caret">▶</span>${esc(dom.name)}</div>
                <span class="domain-score ${scoreClass(avg)}">${avg.toFixed(2)}</span>
              </div>
            </summary>
            <div class="domain-desc">${esc(dom.description || '')}</div>
            <div class="dist-bar">${distBarHtml(counts)}</div>
            <ul class="control-list">
              ${visible.map(c => `
                <li class="control-row">
                  <span class="dot ${esc(c.status)}" title="${esc(c.status)}"></span>
                  <div>
                    <a class="control-link" href="landing_pages/${encodeURIComponent(c.id)}.html">${esc(c.name)}</a>${c.inFocus ? '<span class="focus-badge">In Focus</span>' : ''}
                    <div class="control-desc">${esc(c.description || '')}</div>
                    ${controlMeta(c) ? '<div class="control-meta">' + esc(controlMeta(c)) + '</div>' : ''}
                  </div>
                </li>
              `).join('')}
            </ul>
            ${filtered ? '<div class="control-meta" style="padding: 0 8px 8px">Showing ' + visible.length + ' of ' + dom.controls.length + ' controls in this domain</div>' : ''}
          </details>
        `;
        }).join('');

        const hasFilter = Boolean(q || activeStatus || filterFocus);
        document.getElementById('domains').innerHTML = html ||
            '<div class="empty-state">No controls match the current filters.<br/><button class="btn" onclick="clearFilters()">Clear filters</button></div>';

        const total = allControls().length;
        document.getElementById('filterCount').textContent = hasFilter
            ? totalVisible + ' of ' + total + ' controls'
            : total + ' controls';
        document.getElementById('clearBtn').hidden = !hasFilter;
    }

    function render() {
        renderScoreboard();
        renderDomains();
    }

    // Init
    const metadata = currentData.metadata || {};
    const pageTitle = metadata.title || 'Compliance Dashboard';
    document.title = pageTitle;
    document.getElementById('heroTitle').textContent = pageTitle;
    document.getElementById('heroMeta').innerHTML =
        metadataChips(metadata).map(c => '<span class="meta-chip">' + esc(c) + '</span>').join('');
    if (metadata.icon) {
        const logo = document.getElementById('heroLogo');
        logo.onerror = function() { this.onerror = null; this.src = 'icons/logo.png'; };
        logo.src = 'icons/' + metadata.icon;
    }
    render();

    const searchBox = document.getElementById('searchBox');
    searchBox.addEventListener('input', renderDomains);
    document.addEventListener('keydown', e => {
        if (e.key === '/' && document.activeElement !== searchBox) {
            e.preventDefault();
            searchBox.focus();
        } else if (e.key === 'Escape' && document.activeElement === searchBox) {
            searchBox.blur();
        }
    });
</script>
