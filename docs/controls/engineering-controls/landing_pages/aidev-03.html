<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sensitive Data Protection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
    <style>
        :root {
            --ink: #101828;
            --muted: #667085;
            --faint: #98a2b3;
            --bg: #fafbfc;
            --surface: #ffffff;
            --border: #e4e7ec;
            --accent: #4f46e5;
            --accent-soft: #eef2ff;
            --red: #dc2626;
            --red-soft: #fef2f2;
            --yellow: #d97706;
            --yellow-soft: #fffbeb;
            --green: #16a34a;
            --green-soft: #f0fdf4;
            --focus-flag: #7c3aed;
            --focus-flag-soft: #f5f3ff;
            --radius: 12px;
            --shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-size: 15px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 24px 64px;
        }

        h1, h2 { font-family: 'Space Grotesk', 'Inter', sans-serif; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            margin-bottom: 20px;
            padding: 6px 10px;
            margin-left: -10px;
            border-radius: 8px;
        }

        .back-link:hover { color: var(--accent); background: var(--accent-soft); }

        .back-link:focus-visible, a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ---------- Hero ---------- */
        .hero {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 24px;
        }

        .hero-logo {
            width: 64px;
            height: 64px;
            object-fit: contain;
            border-radius: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 7px;
            flex-shrink: 0;
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 2px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.25;
            margin: 0 0 10px;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
            padding: 4px 12px;
            border-radius: 999px;
        }

        .status-pill .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .status-pill.red { background: var(--red-soft); color: var(--red); }
        .status-pill.yellow { background: var(--yellow-soft); color: var(--yellow); }
        .status-pill.green { background: var(--green-soft); color: var(--green); }

        .focus-badge {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: var(--focus-flag-soft);
            color: var(--focus-flag);
            padding: 4px 10px;
            border-radius: 999px;
        }

        .control-id {
            font-size: 12px;
            color: var(--faint);
            font-variant-numeric: tabular-nums;
        }

        /* ---------- Cards & sections ---------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 24px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--faint);
            margin-bottom: 10px;
        }

        .description {
            font-size: 16px;
            line-height: 1.6;
        }

        /* ---------- Snapshot ---------- */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .stat {
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
        }

        .stat-value {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .stat-label {
            color: var(--muted);
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 2px;
        }

        /* ---------- Scoring criteria ---------- */
        .criteria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .criteria-card {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            background: var(--bg);
        }

        .criteria-card .criteria-head {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 13px;
            text-transform: capitalize;
            margin-bottom: 6px;
        }

        .criteria-card .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }

        .criteria-card.red .criteria-head { color: var(--red); }
        .criteria-card.yellow .criteria-head { color: var(--yellow); }
        .criteria-card.green .criteria-head { color: var(--green); }
        .criteria-card.red .dot { background: var(--red); }
        .criteria-card.yellow .dot { background: #f59e0b; }
        .criteria-card.green .dot { background: var(--green); }

        .criteria-card.active { background: var(--surface); }
        .criteria-card.active.red { border-color: var(--red); }
        .criteria-card.active.yellow { border-color: #f59e0b; }
        .criteria-card.active.green { border-color: var(--green); }

        .criteria-card.inactive { opacity: 0.65; }

        .criteria-text {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
        }

        .current-tag {
            margin-left: auto;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: var(--accent-soft);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 999px;
        }

        /* ---------- Lists ---------- */
        .item-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .item-list li {
            position: relative;
            padding: 7px 0 7px 22px;
            border-top: 1px solid var(--border);
        }

        .item-list li:first-child { border-top: none; }

        .item-list li::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 14px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--faint);
        }

        a { color: var(--accent); overflow-wrap: anywhere; }

        .empty-note { color: var(--faint); font-size: 13px; }

        @media (max-width: 640px) {
            .page { padding: 16px 14px 48px; }
            .hero { gap: 14px; }
            .hero-logo { width: 52px; height: 52px; }
            h1 { font-size: 21px; }
            .card { padding: 16px 18px; }
        }
    </style>
</head>
<body>
<div class="page">
    <a class="back-link" href="../index.html">← Back to dashboard</a>

    <header class="hero">
        <img class="hero-logo" id="heroLogo" src="../icons/engineering.png" onerror="this.onerror=null;this.src='../icons/logo.png'" alt="">
        <div>
            <div class="eyebrow" id="Eyebrow">Compliance Control</div>
            <h1 id="Title"></h1>
            <div class="badges" id="Badges"></div>
        </div>
    </header>

    <main id="Content"></main>
</div>

<script>
    const control = {"id": "aidev-03", "name": "Sensitive Data Protection", "description": "Sensitive data is not exposed to external AI systems.", "priority": "high", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Data handling policy", "Prompt redaction guidance", "DLP controls"], "scoring_criteria": {"red": "Sensitive data can be sent to external AI systems without effective controls.", "yellow": "Basic guardrails exist, but enforcement or awareness is incomplete.", "green": "Sensitive data is protected through clear policy, technical controls, and training."}};
    const domain = {"id": "aidev", "name": "AI-Augmented Development", "description": "Responsible use of AI tools across the software development lifecycle.", "weight": 1.3};

    function esc(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function formatDate(dateValue) {
        if (!dateValue) return 'Not set';
        const date = new Date(dateValue + 'T00:00:00');
        if (isNaN(date.getTime())) return dateValue;
        return date.toLocaleDateString('en-GB', {year: 'numeric', month: 'short', day: 'numeric'});
    }

    function card(title, bodyHtml) {
        return '<section class="card"><div class="section-title">' + esc(title) + '</div>' + bodyHtml + '</section>';
    }

    function itemList(items, formatter) {
        if (!items || !items.length) return '<div class="empty-note">Nothing captured yet.</div>';
        return '<ul class="item-list">' + items.map(i => '<li>' + formatter(i) + '</li>').join('') + '</ul>';
    }

    // Header
    document.getElementById('Title').textContent = control.name || control.id || 'Compliance Control';
    if (domain.name) document.getElementById('Eyebrow').textContent = domain.name;

    let badges = '';
    if (control.status) {
        badges += '<span class="status-pill ' + esc(control.status) + '"><span class="dot"></span>' + esc(control.status) + '</span>';
    }
    if (control.inFocus) badges += '<span class="focus-badge">In Focus</span>';
    if (control.id) badges += '<span class="control-id">' + esc(control.id) + '</span>';
    document.getElementById('Badges').innerHTML = badges;

    // Body
    let html = '';

    if (control.description) {
        html += card('Summary', '<div class="description">' + esc(control.description) + '</div>');
    }

    let stats = '<div class="stats">';
    stats += '<div class="stat"><div class="stat-value">' + esc(control.priority || 'n/a') + '</div><div class="stat-label">Priority</div></div>';
    stats += '<div class="stat"><div class="stat-value">' + esc(control.owner || 'Unassigned') + '</div><div class="stat-label">Owner</div></div>';
    stats += '<div class="stat"><div class="stat-value">' + esc(formatDate(control.last_reviewed)) + '</div><div class="stat-label">Last Reviewed</div></div>';
    stats += '<div class="stat"><div class="stat-value">' + esc(formatDate(control.target_date)) + '</div><div class="stat-label">Target Date</div></div>';
    stats += '</div>';
    html += card('Snapshot', stats);

    let criteria = '<div class="criteria-grid">';
    ['red', 'yellow', 'green'].forEach(status => {
        const text = control.scoring_criteria && control.scoring_criteria[status]
            ? control.scoring_criteria[status]
            : 'No criteria defined.';
        const isActive = control.status === status;
        criteria += '<div class="criteria-card ' + status + (isActive ? ' active' : ' inactive') + '">';
        criteria += '<div class="criteria-head"><span class="dot"></span>' + esc(status) + (isActive ? '<span class="current-tag">Current</span>' : '') + '</div>';
        criteria += '<div class="criteria-text">' + esc(text) + '</div></div>';
    });
    criteria += '</div>';
    html += card('Scoring Criteria', criteria);

    if (control.notes) {
        html += card('Notes', '<div class="description">' + esc(control.notes) + '</div>');
    }

    html += card('Evidence Examples', itemList(control.evidence_examples, item => esc(item)));
    html += card('Evidence Links', itemList(control.evidence_links, item =>
        '<a href="' + esc(item) + '" target="_blank" rel="noopener noreferrer">' + esc(item) + '</a>'));

    document.getElementById('Content').innerHTML = html;
</script>
</body>
</html>
