<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Compliance Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
    <style>
        :root {
            --ink: #101828;
            --muted: #667085;
            --faint: #98a2b3;
            --bg: #fafbfc;
            --surface: #ffffff;
            --border: #e4e7ec;
            --accent: #4f46e5;
            --accent-soft: #eef2ff;
            --red: #dc2626;
            --red-soft: #fef2f2;
            --yellow: #d97706;
            --yellow-soft: #fffbeb;
            --green: #16a34a;
            --green-soft: #f0fdf4;
            --focus-flag: #7c3aed;
            --focus-flag-soft: #f5f3ff;
            --radius: 12px;
            --shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            max-width: 1240px;
            margin: 0 auto;
            padding: 32px 24px 64px;
        }

        h1, h2, h3, .score-value {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
        }

        .muted { color: var(--muted); }

        /* ---------- Hero ---------- */
        .hero {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .hero-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            border-radius: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px;
            flex-shrink: 0;
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 2px;
        }

        .hero-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0 0 8px;
            line-height: 1.2;
        }

        .meta-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .meta-chip {
            font-size: 12px;
            color: var(--muted);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 3px 10px;
            white-space: nowrap;
            max-width: 420px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---------- Scoreboard ---------- */
        .scoreboard {
            display: flex;
            align-items: stretch;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .maturity-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 22px;
            min-width: 280px;
            flex: 1 1 300px;
        }

        .score-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .score-value {
            font-size: 34px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .score-denom {
            font-size: 15px;
            color: var(--faint);
            font-variant-numeric: tabular-nums;
        }

        .band-label {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .dist-bar {
            display: flex;
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
            background: var(--border);
        }

        .dist-bar .seg-red { background: var(--red); }
        .dist-bar .seg-yellow { background: #f59e0b; }
        .dist-bar .seg-green { background: var(--green); }

        /* ---------- Filter chips ---------- */
        .filters {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            align-content: center;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 8px 14px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
        }

        .chip:hover { border-color: var(--faint); }

        .chip:focus-visible,
        .search-input:focus-visible,
        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .chip .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .chip .count {
            font-variant-numeric: tabular-nums;
            color: var(--muted);
        }

        .chip.red .dot { background: var(--red); }
        .chip.yellow .dot { background: #f59e0b; }
        .chip.green .dot { background: var(--green); }
        .chip.focus .dot { background: var(--focus-flag); }

        .chip.active { border-color: currentColor; }
        .chip.red.active { background: var(--red-soft); color: var(--red); }
        .chip.yellow.active { background: var(--yellow-soft); color: var(--yellow); }
        .chip.green.active { background: var(--green-soft); color: var(--green); }
        .chip.focus.active { background: var(--focus-flag-soft); color: var(--focus-flag); }
        .chip.active .count { color: inherit; }

        /* ---------- Toolbar ---------- */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 0;
            margin-bottom: 20px;
            background: linear-gradient(var(--bg) 85%, rgba(250, 251, 252, 0));
        }

        .search-wrap {
            position: relative;
            flex: 1 1 260px;
            max-width: 440px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--faint);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            font: inherit;
            font-size: 14px;
            padding: 9px 36px 9px 36px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--ink);
            box-shadow: var(--shadow);
        }

        .search-input::placeholder { color: var(--faint); }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .search-hint {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 11px;
            color: var(--faint);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 1px 6px;
            background: var(--bg);
            pointer-events: none;
        }

        .filter-count {
            color: var(--muted);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .btn {
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
        }

        .btn:hover { background: var(--accent-soft); }
        .btn[hidden] { display: none; }

        /* ---------- Domain cards ---------- */
        .domains {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
            align-items: start;
        }

        .domain-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 20px 10px;
        }

        .domain-card summary {
            cursor: pointer;
            list-style: none;
        }

        .domain-card summary::-webkit-details-marker { display: none; }

        .domain-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .domain-name {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
        }

        .domain-name .caret {
            display: inline-block;
            color: var(--faint);
            font-size: 11px;
            margin-right: 6px;
            transition: transform 0.15s;
        }

        details[open] .domain-name .caret { transform: rotate(90deg); }

        .domain-score {
            font-size: 12px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            padding: 3px 9px;
            border-radius: 999px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .domain-score.red { background: var(--red-soft); color: var(--red); }
        .domain-score.yellow { background: var(--yellow-soft); color: var(--yellow); }
        .domain-score.green { background: var(--green-soft); color: var(--green); }

        .domain-desc {
            color: var(--muted);
            font-size: 13px;
            margin: 6px 0 10px;
        }

        .domain-card .dist-bar { height: 5px; margin-bottom: 4px; }

        /* ---------- Control rows ---------- */
        .control-list {
            margin: 6px 0 8px;
            padding: 0;
            list-style: none;
        }

        .control-row {
            display: flex;
            gap: 10px;
            padding: 10px 8px;
            border-radius: 8px;
            border-top: 1px solid var(--border);
        }

        .control-row:hover { background: var(--bg); }

        .control-row .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 6px;
            flex-shrink: 0;
        }

        .dot.red { background: var(--red); }
        .dot.yellow { background: #f59e0b; }
        .dot.green { background: var(--green); }

        .control-link {
            color: var(--ink);
            font-weight: 500;
            text-decoration: none;
        }

        .control-link:hover { color: var(--accent); text-decoration: underline; }

        .control-desc {
            color: var(--muted);
            font-size: 13px;
            margin-top: 1px;
        }

        .control-meta {
            color: var(--faint);
            font-size: 12px;
            margin-top: 3px;
        }

        .focus-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: var(--focus-flag-soft);
            color: var(--focus-flag);
            padding: 2px 7px;
            border-radius: 999px;
            margin-left: 8px;
            vertical-align: 1px;
        }

        /* ---------- Empty state / footer ---------- */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 56px 20px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
        }

        .empty-state .btn { margin-top: 8px; }

        .page-footer {
            margin-top: 40px;
            color: var(--faint);
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 640px) {
            .page { padding: 20px 14px 48px; }
            .hero { gap: 14px; }
            .hero-logo { width: 56px; height: 56px; }
            .hero-title { font-size: 22px; }
            .domains { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
<div class="page">
    <header class="hero">
        <img class="hero-logo" id="heroLogo" src="icons/logo.png" alt="">
        <div>
            <div class="eyebrow">Controls Dashboard</div>
            <h1 id="heroTitle" class="hero-title">Compliance Dashboard</h1>
            <div id="heroMeta" class="meta-chips"></div>
        </div>
    </header>

    <section class="scoreboard" aria-label="Overall maturity and filters">
        <div class="maturity-card">
            <div class="score-row">
                <span class="score-value" id="scoreValue">–</span>
                <span class="score-denom">/ 3.00 weighted maturity</span>
            </div>
            <div class="band-label" id="bandLabel"></div>
            <div class="dist-bar" id="overallBar" title="Distribution of control statuses"></div>
        </div>
        <div class="filters" id="filters" role="group" aria-label="Filter controls by status"></div>
    </section>

    <div class="toolbar">
        <div class="search-wrap">
            <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
            <input type="search" class="search-input" id="searchBox" placeholder="Search controls, domains, owners…" aria-label="Search controls"/>
            <span class="search-hint" id="searchHint">/</span>
        </div>
        <span id="filterCount" class="filter-count" aria-live="polite"></span>
        <button class="btn" id="clearBtn" hidden onclick="clearFilters()">Clear filters</button>
    </div>

    <main id="domains" class="domains"></main>

    <footer class="page-footer">Generated on 2026-08-23</footer>
</div>

<script>
    const currentData = {"metadata": {"title": "EU-focused CTO Security & Compliance Checklist", "version": "2.0", "created_at": "2026-03-21T11:01:55.571035+00:00", "icon": "security.png", "intended_use": ["Track control status", "Store evidence links", "Assign owners", "Support simple dashboarding and scoring"], "regions": ["EU/EEA"], "primary_regulatory_focus": ["GDPR", "PCI DSS", "ePrivacy/cookie compliance", "DSA", "DMA"], "status_values": ["red", "yellow", "green"], "default_status": "red"}, "scoring_model": {"status_to_score": {"red": 1, "yellow": 2, "green": 3}, "score_to_status": {"1": "red", "2": "yellow", "3": "green"}, "definitions": {"red": {"score": 1, "label": "High risk / non-compliant", "criteria": ["Control missing or ineffective", "Material legal, financial, operational, or breach exposure", "No reliable evidence, or evidence is ad hoc/outdated"]}, "yellow": {"score": 2, "label": "Partial / immature", "criteria": ["Control exists but is incomplete, inconsistent, or not enforced everywhere", "Evidence exists but is manual, partial, or not recent", "Process depends on individuals rather than systematic control"]}, "green": {"score": 3, "label": "Effective / audit-ready", "criteria": ["Control is documented, implemented, and enforced", "Evidence is recent, repeatable, and preferably automated", "Ownership, monitoring, and review cadence are in place"]}}, "overall_maturity_bands": [{"min": 1.0, "max": 1.5, "status": "red", "label": "High risk / urgent stabilization"}, {"min": 1.6, "max": 2.2, "status": "yellow", "label": "Developing / structured improvement needed"}, {"min": 2.3, "max": 3.0, "status": "green", "label": "Mature / optimize and certify"}]}, "dashboard_fields": {"control_level": ["id", "name", "description", "priority", "weight", "status", "score", "owner", "last_reviewed", "target_date", "notes", "evidence_links", "evidence_examples", "scoring_criteria"], "domain_level": ["id", "name", "description", "weight", "controls"]}, "domains": [{" llow": "RoPA exists but is partial, outdated, or not tied to real systems.", "green": "RoPA is current, complete, mapped to systems, and reviewed periodically."}}, {"id": "grc-04", "name": "DPIA Process", "description": "Perform DPIAs for high-risk processing activities.", "priority": "High", "weight": 1.0, "status": "green", "score": 3, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["DPIA templates", "Completed DPIAs", "Decision log for when DPIA is required"], "scoring_criteria": {"red": "No DPIA process or high-risk processing without assessment.", "yellow": "DPIAs are done inconsistently or only after launch.", "green": "DPIAs are required, documented, and completed before risky processing starts."}}, {"id": "grc-05", "name": "Management Reporting", "description": "Provide regular security and compliance reporting to leadership.", "priority": "High", "weight": 1.0, "status": "yellow", "score": 2, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Quarterly board pack", "Security KPI dashboard", "Audit update presentation"], "scoring_criteria": {"red": "Leadership receives little or no formal security reporting.", "yellow": "Reporting exists but is ad hoc or operationally shallow.", "green": "Leadership receives recurring, decision-useful reporting with trends and actions."}}]}, {"id": "dp", "name": "Data Protection & Privacy", "description": "GDPR-focused controls over customer and employee personal data.", "weight": 1.4, "controls": [{"id": "dp-01", "name": "Data Inventory and Classification", "description": "Maintain an inventory of systems, data categories, and classification levels.", "priority": "High", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Data inventory", "Data flow diagrams", "Classification standard", "System inventory with PII tags"], "scoring_criteria": {"red": "No reliable inventory of personal data or data classes.", "yellow": "Inventory exists for key systems only or classification is inconsistent.", "green": "Inventory is comprehensive, classified, and linked to owners and retention."}}, {"id": "dp-02", "name": "Lawful Basis and Purpose Limitation", "description": "Document the lawful basis and specific purpose for each processing activity.", "priority": "High", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Lawful basis register", "Privacy notice mapping", "Consent model design"], "scoring_criteria": {"red": "Lawful basis is unclear or undocumented for one or more processing activities.", "yellow": "Lawful basis is documented for some but not all core processing activities.", "green": "Each processing activity has a documented lawful basis and purpose, aligned with notices."}}, {"id": "dp-03", "name": "Data Subject Rights Handling", "description": "Support access, deletion, rectification, portability, and objection requests within deadlines.", "priority": "High", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["DSAR workflow", "DSAR ticket log", "Response templates", "Deletion verification checklist"], "scoring_criteria": {"red": "No operational DSAR process or repeated missed deadlines.", "yellow": "DSARs are handled manually with inconsistent completeness.", "green": "DSAR workflow is defined, tracked, timely, and testable across systems."}}, {"id": "dp-04", "name": "Retention and Deletion", "description": "Enforce retention schedules and deletion for personal data.", "priority": "High", "weight": 1.0, "status": "green", "score": 3, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Retention schedule : "Use KPIs, audits, and remediation tracking to improve over time.", "weight": 1.1, "controls": [{"id": "metrics-01", "name": "Security KPI Dashboard", "description": "Track a core set of measurable security and compliance indicators.", "priority": "High", "weight": 1.0, "status": "green", "score": 3, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["KPI dashboard", "Monthly trend report", "Leadership summary"], "scoring_criteria": {"red": "No agreed security KPI set exists.", "yellow": "Some metrics are tracked but lack consistency or audience relevance.", "green": "KPIs are defined, trended, and used in management decision-making."}}, {"id": "metrics-02", "name": "Vulnerability Remediation SLAs", "description": "Define and measure remediation performance by severity.", "priority": "High", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["SLA policy", "Open findings by age", "Exception approvals"], "scoring_criteria": {"red": "No remediation SLAs or widespread breach of expectations.", "yellow": "SLAs exist but performance or exception handling is weak.", "green": "SLAs are measurable, monitored, and exceptions are controlled."}}, {"id": "metrics-03", "name": "Audit Findings Tracking", "description": "Track audit and assessment findings to closure.", "priority": "High", "weight": 1.0, "status": "yellow", "score": 2, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Internal audit report", "External assessment findings", "Remediation tracker"], "scoring_criteria": {"red": "Findings are not centrally tracked or close-out is unreliable.", "yellow": "Tracking exists but ownership or timeliness is weak.", "green": "Findings are tracked with owners, due dates, and closure evidence."}}, {"id": "metrics-04", "name": "Periodic Internal Review", "description": "Review the control environment on a recurring cadence.", "priority": "High", "weight": 1.0, "status": "red", "score": 1, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Quarterly review pack", "Control self-assessment", "Annual plan"], "scoring_criteria": {"red": "No recurring review cadence exists.", "yellow": "Reviews happen but lack structure or completeness.", "green": "Reviews are scheduled, evidence-based, and drive updates."}}]}, {"id": "dsa_dma", "name": "EU Digital Services Act (DSA) & Digital Markets Act (DMA)", "description": "Compliance with EU platform regulation covering transparency, illegal content handling, marketplace accountability, and fair competition obligations.", "weight": 1.3, "controls": [{"id": "dsa-01", "name": "Notice and Action Mechanism", "description": "Provide mechanisms for users and authorities to report illegal content and act on it.", "priority": "High", "weight": 1.0, "status": "green", "score": 3, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Notice submission logs", "Content removal workflow", "Moderation SLA reports"], "scoring_criteria": {"red": "No clear reporting mechanism or no action process.", "yellow": "Reporting exists but handling is inconsistent or slow.", "green": "Well-defined, timely notice-and-action process with audit logs."}}, {"id": "dsa-02", "name": "Content Moderation Transparency", "description": "Document and report moderation decisions and policies.", "priority": "High", "weight": 1.0, "status": "yellow", "score": 2, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Transparency reports", "Moderation policy", "Decision logs"], "scoring_criteria": {"red": "No transparency on moderation decisions.", "yellow": "Partial documentation without consistent reporting.", "green": "Regular transparency reporting and traceable moderation decisions."}}, {"id": "dsa-03", "name": "Trader / Seller Verification (Marketplace)", "description": "Verify identity of sellers on the platform (Know Your Business Customer).", "priority": "High", "weight": 1.0, "status": "green", "score": 3, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["KYC/KYB records", "Seller onboarding checklist", "Verification logs"], "scoring_criteria": {"red": "No seller verification process.", "yellow": "Basic verification without strong validation.", "green": "Robust verification with audit trail and periodic review."}}, {"id": "dsa-04", "name": "Recommendation System Transparency", "description": "Explain how recommendation or ranking systems work.", "priority": "High", "weight": 1.0, "status": "green", "score": 3, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Algorithm description", "User explanation UI", "Opt-out mechanism"], "scoring_criteria": {"red": "No visibility into recommendation logic.", "yellow": "High-level explanation without user control.", "green": "Clear explanation and user control options provided."}}, {"id": "dma-01", "name": "Fair Platform Practices", "description": "Ensure no unfair self-preferencing or anti-competitive practices.", "priority": "High", "weight": 1.0, "status": "yellow", "score": 2, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Internal audit reports", "Ranking neutrality analysis", "Policy documents"], "scoring_criteria": {"red": "Potential anti-competitive practices with no oversight.", "yellow": "Policies exist but no active monitoring.", "green": "Active monitoring and documented compliance with fair practices."}}, {"id": "dma-02", "name": "Data Access and Portability", "description": "Provide business users access to their data and portability options.", "priority": "High", "weight": 1.0, "status": "green", "score": 3, "owner": "", "last_reviewed": "", "target_date": "", "notes": "", "evidence_links": [], "evidence_examples": ["Data export tools", "API access logs", "User documentation"], "scoring_criteria": {"red": "No data access or export capability.", "yellow": "Partial access with limitations.", "green": "Full, documented, and tested data portability mechanisms."}}]}]};
    let activeStatus = '';
    let filterFocus = false;

    function esc(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function metadataChips(metadata) {
        if (!metadata) return [];
        const chips = [];
        if (metadata.version) chips.push('v' + metadata.version);
        if (metadata.regions && metadata.regions.length) chips.push(metadata.regions.join(', '));
        (metadata.primary_regulatory_focus || []).forEach(f => chips.push(f));
        if (metadata.source && metadata.source.title) {
            chips.push(metadata.source.author
                ? metadata.source.title + ' — ' + metadata.source.author
                : metadata.source.title);
        }
        return chips;
    }

    function safeScore(control) {
        if (typeof control.score === "number") return control.score;
        return {red: 1, yellow: 2, green: 3}[control.status] || 1;
    }

    function weightedAverage(controls, domainWeight) {
        let weighted = 0, weights = 0;
        controls.forEach(c => {
            const w = (domainWeight || 1) * (c.weight || 1);
            weighted += safeScore(c) * w;
            weights += w;
        });
        return weights ? (weighted / weights) : 0;
    }

    function overallMaturity() {
        let weighted = 0, weights = 0;
        currentData.domains.forEach(d => {
            d.controls.forEach(c => {
                const w = (d.weight || 1) * (c.weight || 1);
                weighted += safeScore(c) * w;
                weights += w;
            });
        });
        return weights ? (weighted / weights) : 0;
    }

    function maturityBand(score) {
        const bands = (currentData.scoring_model && currentData.scoring_model.overall_maturity_bands) || [];
        for (const b of bands) {
            if (score >= b.min && score <= b.max) return b;
        }
        return null;
    }

    function scoreClass(score) {
        const band = maturityBand(score);
        if (band && band.status) return band.status;
        return score < 1.6 ? 'red' : score < 2.3 ? 'yellow' : 'green';
    }

    function countStatuses(controls) {
        const counts = {red: 0, yellow: 0, green: 0, focus: 0, total: 0};
        controls.forEach(c => {
            counts[c.status] = (counts[c.status] || 0) + 1;
            if (c.inFocus) counts.focus++;
            counts.total++;
        });
        return counts;
    }

    function allControls() {
        return currentData.domains.flatMap(d => d.controls);
    }

    function distBarHtml(counts) {
        if (!counts.total) return '';
        return ['red', 'yellow', 'green']
            .filter(s => counts[s] > 0)
            .map(s => '<div class="seg-' + s + '" style="flex:' + counts[s] + '" title="' + counts[s] + ' ' + s + '"></div>')
            .join('');
    }

    function toggleStatus(status) {
        filterFocus = false;
        activeStatus = activeStatus === status ? '' : status;
        render();
    }

    function toggleFocus() {
        filterFocus = !filterFocus;
        activeStatus = '';
        render();
    }

    function clearFilters() {
        activeStatus = '';
        filterFocus = false;
        document.getElementById('searchBox').value = '';
        render();
    }

    function renderScoreboard() {
        const score = overallMaturity();
        const band = maturityBand(score);
        const counts = countStatuses(allControls());

        document.getElementById('scoreValue').textContent = score.toFixed(2);
        document.getElementById('bandLabel').textContent = band ? band.label : '';
        document.getElementById('overallBar').innerHTML = distBarHtml(counts);

        const chip = (cls, label, count, active, onclick) =>
            '<button class="chip ' + cls + (active ? ' active' : '') + '" aria-pressed="' + active + '" onclick="' + onclick + '">' +
            '<span class="dot"></span>' + label + '<span class="count">' + count + '</span></button>';

        document.getElementById('filters').innerHTML =
            chip('red', 'Red', counts.red, activeStatus === 'red', "toggleStatus('red')") +
            chip('yellow', 'Yellow', counts.yellow, activeStatus === 'yellow', "toggleStatus('yellow')") +
            chip('green', 'Green', counts.green, activeStatus === 'green', "toggleStatus('green')") +
            (counts.focus ? chip('focus', 'In Focus', counts.focus, filterFocus, 'toggleFocus()') : '');
    }

    function controlMeta(c) {
        const parts = [];
        if (c.owner) parts.push(c.owner);
        if (c.priority) parts.push(c.priority + ' priority');
        if (c.target_date) parts.push('Target ' + c.target_date);
        return parts.join(' · ');
    }

    function renderDomains() {
        const q = document.getElementById('searchBox').value.trim().toLowerCase();
        let totalVisible = 0;

        const html = currentData.domains.map(dom => {
            const visible = dom.controls.filter(c => {
                if (filterFocus && !c.inFocus) return false;
                if (activeStatus && c.status !== activeStatus) return false;
                if (q) {
                    const blob = [dom.name, c.id, c.name, c.description, c.owner, c.priority, c.notes].join(' ').toLowerCase();
                    if (!blob.includes(q)) return false;
                }
                return true;
            });

            if (!visible.length) return '';
            totalVisible += visible.length;

            const avg = weightedAverage(dom.controls);
            const counts = countStatuses(dom.controls);
            const filtered = visible.length < dom.controls.length;

            return `
          <details open class="domain-card">
            <summary>
              <div class="domain-head">
                <div class="domain-name"><span class="caret">▶</span>${esc(dom.name)}</div>
                <span class="domain-score ${scoreClass(avg)}">${avg.toFixed(2)}</span>
              </div>
            </summary>
            <div class="domain-desc">${esc(dom.description || '')}</div>
            <div class="dist-bar">${distBarHtml(counts)}</div>
            <ul class="control-list">
              ${visible.map(c => `
                <li class="control-row">
                  <span class="dot ${esc(c.status)}" title="${esc(c.status)}"></span>
                  <div>
                    <a class="control-link" href="landing_pages/${encodeURIComponent(c.id)}.html">${esc(c.name)}</a>${c.inFocus ? '<span class="focus-badge">In Focus</span>' : ''}
                    <div class="control-desc">${esc(c.description || '')}</div>
                    ${controlMeta(c) ? '<div class="control-meta">' + esc(controlMeta(c)) + '</div>' : ''}
                  </div>
                </li>
              `).join('')}
            </ul>
            ${filtered ? '<div class="control-meta" style="padding: 0 8px 8px">Showing ' + visible.length + ' of ' + dom.controls.length + ' controls in this domain</div>' : ''}
          </details>
        `;
        }).join('');

        const hasFilter = Boolean(q || activeStatus || filterFocus);
        document.getElementById('domains').innerHTML = html ||
            '<div class="empty-state">No controls match the current filters.<br/><button class="btn" onclick="clearFilters()">Clear filters</button></div>';

        const total = allControls().length;
        document.getElementById('filterCount').textContent = hasFilter
            ? totalVisible + ' of ' + total + ' controls'
            : total + ' controls';
        document.getElementById('clearBtn').hidden = !hasFilter;
    }

    function render() {
        renderScoreboard();
        renderDomains();
    }

    // Init
    const metadata = currentData.metadata || {};
    const pageTitle = metadata.title || 'Compliance Dashboard';
    document.title = pageTitle;
    document.getElementById('heroTitle').textContent = pageTitle;
    document.getElementById('heroMeta').innerHTML =
        metadataChips(metadata).map(c => '<span class="meta-chip">' + esc(c) + '</span>').join('');
    if (metadata.icon) {
        const logo = document.getElementById('heroLogo');
        logo.onerror = function() { this.onerror = null; this.src = 'icons/logo.png'; };
        logo.src = 'icons/' + metadata.icon;
    }
    render();

    const searchBox = document.getElementById('searchBox');
    searchBox.addEventListener('input', renderDomains);
    document.addEventListener('keydown', e => {
        if (e.key === '/' && document.activeElement !== searchBox) {
            e.preventDefault();
            searchBox.focus();
        } else if (e.key === 'Escape' && document.activeElement === searchBox) {
            searchBox.blur();
        }
    });
</script>
